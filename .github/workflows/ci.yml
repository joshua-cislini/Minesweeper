name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: windows / msys2-ucrt64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
      - name: Build (debug)
        run: mingw32-make WERROR=1
      - name: Test (debug)
        run: mingw32-make test WERROR=1
      - name: Build and test (release)
        run: mingw32-make release test WERROR=1